name: Build

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:
  schedule:
    - cron:  '0 0 * * *'

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
      fail-fast: false

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install broker
      run: |
        docker pull opendxl/opendxl-broker
        docker run -d -p 8883:8883 -p 8443:8443 -p 443:443 opendxl/opendxl-broker
        docker ps -a

    - name: Install dependencies
      run: |
        pip install --upgrade pip wheel
        # dxlbootstrap 0.2.x still imports pkg_resources, which setuptools >= 82 no longer ships
        pip install "setuptools<82"
        # The dxlclient release on PyPI pins msgpack<1.0.0 (GHSA-6v7p-g79w-8964);
        # install the fixed client from the fork before the project pulls it in
        pip install "dxlclient @ git+https://github.com/derjochenmueller/opendxl-client-python@epo-legacy"
        pip install .[test]

    - name: Execute CI
      run: |
        python -m dxlclient provisionconfig tests 127.0.0.1 client -u admin -p password
        python -m dxlclient provisionconfig sample 127.0.0.1 sampleclient -u admin -p password
        cat tests/dxlclient.config
        cat sample/dxlclient.config
        python -m pytest tests
